plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.140'
    id 'idea'
}

version = "${minecraft_version}-${mod_version}"
group = 'yamikingg.zombiesmore_yamikingg'

base {
    archivesName = "zombiesmore"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neoforge_version

    parchment {
         minecraftVersion = project.parchment_mc
         mappingsVersion = project.parchment_mappings
    }

    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
            gameDirectory = project.file('run')
            systemProperty 'neoforge.logging.markers', 'REGISTRIES'
            systemProperty 'neoforge.logging.console.level', 'debug'
        }

        server {
            server()
            gameDirectory = project.file('run')
            programArgument '--nogui'
            systemProperty 'neoforge.logging.markers', 'REGISTRIES'
            systemProperty 'neoforge.logging.console.level', 'debug'
        }

        data {
            data()
            gameDirectory = project.file('run')
            programArguments.addAll(
                    '--mod', 'zombiesmore_yamikingg',
                    '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
            )
            systemProperty 'neoforge.logging.markers', 'REGISTRIES'
            systemProperty 'neoforge.logging.console.level', 'debug'
        }
    }

    mods {
        "zombiesmore_yamikingg" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include generated resources
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()

}

dependencies {
    // NeoForge is now handled by the neoForge {} block - NO implementation line needed!

    // Example: compile-time only dependency
    // compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"

    // Example: runtime-only dependency (won't be published)
    // localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
}

// Process resources with property expansion (for mods.toml)
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            neo_version             : neoforge_version,
            loader_version_range    : loader_version_range,
            mod_id                  : "zombiesmore_yamikingg",
            mod_name                : "MoZombies Wave",
            mod_license             : "YOUR_LICENSE",
            mod_version             : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"  // Place your mods.toml template here
    into "build/generated/sources/modMetadata"
}

// Include generated metadata in resources
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata  // Auto-run on IDE sync

// Optional: Jar manifest configuration
jar {
    manifest {
        attributes([
                "Specification-Title"     : "zombiesmore",
                "Specification-Vendor"    : "yamikingg",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : "${version}",
                "Implementation-Vendor"   : "yamikingg",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

// Publishing configuration (optional)
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Enable source/javadoc downloads for IDEA
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}