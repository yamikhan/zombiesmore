
buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://maven.parchmentmc.org' }
        mavenCentral()
    }

    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '[6.0,6.2)', changing: true
        classpath 'org.parchmentmc:librarian:1.+'
    }
}
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.parchmentmc.librarian.forgegradle'
apply plugin: 'eclipse'

version = "${minecraft_version}-${mod_version}"
group = 'yamikingg.zombiesmore_yamikingg'
archivesBaseName = "ZombiesMore"

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft {
    mappings channel: 'parchment', version: '2024.11.17-1.21.1'

    runs {
        client {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${buildDir}/createSrgToMcp/output.srg"

            mods {
                zombiesmore_yamikingg {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${buildDir}/createSrgToMcp/output.srg"

            mods {
                zombiesmore_yamikingg {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            args '--mod', 'zombiesmore_yamikingg', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')

            mods {
                zombiesmore_yamikingg {
                    source sourceSets.main
                }
            }
        }
    }
}

processResources {
    // This ensures the mod_version property is available during expansion
    inputs.property "mod_version", project.findProperty('mod_version') ?: '0.2.4'

    filesMatching("META-INF/mods.toml") {
        // This replaces ${mod_version} with the actual value
        expand "mod_version": project.findProperty('mod_version') ?: '0.2.4'
    }

    // This handles any other files that might need expansion
    filesMatching("**/*.toml") {
        expand "mod_version": project.findProperty('mod_version') ?: '0.2.4'
    }
}

// Add source sets for generated data
sourceSets.main.resources { srcDir 'src/generated/resources' }

jar {
    manifest {
        attributes([
                "Specification-Title"     : "zombiesmore",
                "Specification-Vendor"    : "yamikingg",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : "${version}",
                "Implementation-Vendor"   : "yamikingg",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Optional: If you use mixins
    // annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    //compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}:${jei_version}:api")
    //runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}:${jei_version}")
    //compileOnly fg.deobf("curse.maven:project-mmo-${pmmo_version}")
    //runtimeOnly fg.deobf("curse.maven:project-mmo-${pmmo_version}")
}

repositories {
    maven {
        // location of the maven that hosts JEI files
        name = "Progwml6 maven"
        url = "https://dvs1.progwml6.com/files/maven/"
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.k-4u.nl"
    }
    maven {
        url =  "https://maven.latmod.com/"
    }
    maven {
        url "https://www.cursemaven.com"
    }
    maven {
        url "https://maven.shedaniel.me/"
    }
    maven {
        url "https://maven.parchmentmc.org"  // Ensure Parchment is in repositories
    }
}
sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}
// Optional: Configure jar output
jar.finalizedBy('reobfJar')