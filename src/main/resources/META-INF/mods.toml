description='''
Remake of the original Mo'Zombies mod from Minecraft 1.7.10.

Adds various themed zombie variants to the game including:
- Disco Zombie
- Nether Zombie
- Zombie Dwarf
- Zombie Chef
- Zombie Cyborg
- Zombie Herobrine
- Zombie King
- Zombie Knight
- Zombie Miner
- Zombie PA
- Zombie Pirate
- Zombie Creeper (Hybrid)
- Giant (Vanilla enhanced)
- Survivor (Friendly NPC)

Features custom spawn placements and behaviors for each zombie type.
'''

